# Deploy HighTech CBC Learners to Cloudflare Workers after merge to main.
# One-time: GitHub → Settings → Secrets and variables → Actions →
#   CLOUDFLARE_API_TOKEN  (Edit Cloudflare Workers + D1 Edit)
# Account ID is already in web/wrangler.jsonc.
name: Deploy HighTech CBC Learners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hightech-cbc-learners
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add GitHub Actions secret CLOUDFLARE_API_TOKEN (Cloudflare dashboard → My Profile → API Tokens → Edit Cloudflare Workers, plus D1 Edit)."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PRIVATE_WORKER_THREADS: 'false'
